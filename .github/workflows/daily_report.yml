name: Daily Finance Report

on:
  schedule:
    # GitHub Actions 定时任务实测延迟约 3 小时：
    # UTC 21:35（北京 05:35）+ 延迟 ≈ 北京 08:30 送达
    - cron: "35 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python main.py

      - name: Deploy public site (GitHub Pages)
        if: success()
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: python scripts/deploy_site.py

      - name: Notify Feishu on success
        if: success()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -d '{"msg_type":"text","content":{"text":"✅ CHE直早报今日日报已生成并推送（邮件+微信）。"}}' \
            "$FEISHU_WEBHOOK" || true

      - name: Notify Feishu on failure
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -d '{"msg_type":"text","content":{"text":"❌ 今日日报生成失败，请查看 GitHub Actions 运行日志；也可在飞书发「重跑日报」让本地重跑。"}}' \
            "$FEISHU_WEBHOOK" || true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-report
          path: output/
          retention-days: 7
